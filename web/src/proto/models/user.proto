// User accounts (the `users` table). `id` is an INTEGER PRIMARY KEY (SQLite
// rowid alias, the internal owner reference); `uid` is the stable UUIDv7 that is
// the account's public, non-enumerable identity (tokens, UserView, URLs).

syntax = "proto3";

package app.v1;

// Email is the private login identifier; username is the public display name;
// password_hash is a bcrypt hash (never the raw password). `uid` is the public
// UUIDv7 identity; the int `id` stays internal (owner columns).
message User {
  int32 id = 1;
  string email = 2;
  string username = 3;
  string password_hash = 4;
  string uid = 5;
}
