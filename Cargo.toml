[package]
name = "termset-cli"
version = "0.1.0"
edition = "2024"

[features]
# The paid-license model: offline license verification plus the unregistered
# "buy a license" nag. On by default; `--no-default-features` compiles the whole
# thing out and ships an unrestricted binary (the "turn the model off" switch).
default = ["licensing"]
licensing = []

# The CLI binary is `terms`; the library crate is `termset_cli` (the test
# harness in `testkit` drives termset headlessly).
[[bin]]
name = "terms"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "0.26.0"
arboard = "3.6.1"
ed25519-compact = "2"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
softbuffer = "0.4"
winit = "0.30"

# Linux-only: mark the window opaque + black-backed before it maps, so the
# compositor never shows a see-through (desktop-behind) frame on open. Versions
# match what winit/softbuffer already pull in transitively.
[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
x11rb = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
