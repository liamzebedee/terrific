[package]
name = "termset-cli"
version = "0.1.0"
edition = "2024"

# The CLI binary is `mtm`; the library crate stays `termem_demo` (the test
# harness in `testkit` drives it headlessly).
[[bin]]
name = "terms"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "0.26.0"
arboard = "3.6.1"
ed25519-compact = "2"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
softbuffer = "0.4"
winit = "0.30"

# Linux-only: mark the window opaque + black-backed before it maps, so the
# compositor never shows a see-through (desktop-behind) frame on open. Versions
# match what winit/softbuffer already pull in transitively.
[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
x11rb = "0.13"

# macOS-only: reach softbuffer's CALayer to back it with the theme background,
# so the strip a growing window exposes ahead of our next frame is that colour
# rather than black. Versions match what softbuffer already pulls in transitively.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-graphics = { version = "0.3", features = ["std", "CGColor", "CGColorSpace"] }
objc2-quartz-core = { version = "0.3", features = ["std", "CALayer", "objc2-core-graphics"] }
raw-window-handle = "0.6"

[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
